<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Barang - Aksesa Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  body{background:linear-gradient(135deg,#FFE6F2 0%,#E6F0FF 100%);min-height:100vh;padding:20px;font-family:'Poppins'}
  .container{max-width:500px;margin:0 auto;background:rgba(255,255,255,0.9);padding:30px;border-radius:25px;border:2px solid white}
  h1{text-align:center;color:#FF82C1} 
  input,button{width:100%;padding:12px;border:2px solid #E6F0FF;border-radius:15px;margin-bottom:15px}
  button{background:linear-gradient(90deg,#FF82C1,#82B6FF);color:white;font-weight:700;border:none}
  a{color:#82B6FF;text-decoration:none}
</style>
</head>
<body>
  <div class="container">
    <h1>➕ Input Barang</h1>
    <input type="text" placeholder="Nama Barang">
    <input type="number" placeholder="Harga">
    <input type="number" placeholder="Stok">
    <button>Simpan Barang</button>
    <a href="dashboard.html">← Kembali ke Dashboard</a>
  </div>
</body>
</html>
